name: Bug report
description: Something in a mod does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options:
        - limits-meter
        - allowlist-coach
        - agent-watch
        - test-hud
        - launchpad
        - plain-view
        - Other / whole collection
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/limits`
        2. ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Run `claude --version`. The mods require 2.1.287 or later.
      placeholder: "2.1.287"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: macOS 15, iTerm2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything that helps, such as a screenshot of the band or pane.
