<svg xmlns="http://www.w3.org/2000/svg" width="836" height="752" viewBox="0 0 836 752" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14"><rect width="836" height="752" rx="10" fill="#16161e"/><rect width="836" height="30" rx="10" fill="#22222c"/><rect y="20" width="836" height="10" fill="#22222c"/><circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/><text x="418.0" y="19" fill="#7c7c88" font-size="12" text-anchor="middle">allowlist-coach</text><text x="20" y="52" fill="#8a8aa0" font-size="11" letter-spacing="1">UNDER THE PERMISSION DIALOG (LAST LINE)</text><rect x="20" y="66" width="796" height="220" rx="6" fill="none" stroke="#3a3a48"/><text x="32" y="91" xml:space="preserve"><tspan fill="#d4d4d8" font-weight="700">Bash command</tspan></text><text x="32" y="111" xml:space="preserve"><tspan fill="#d4d4d8">  ./mvnw test -Dtest=OrderServiceTest</tspan></text><text x="32" y="131" xml:space="preserve"><tspan fill="#7c7c88">  Run the order service tests</tspan></text><text x="32" y="171" xml:space="preserve"><tspan fill="#d4d4d8">Do you want to proceed?</tspan></text><text x="32" y="191" xml:space="preserve"><tspan fill="#56b6c2">❯ 1. Yes</tspan></text><text x="32" y="211" xml:space="preserve"><tspan fill="#d4d4d8">  2. Yes, and don't ask again for ./mvnw test commands in /repo</tspan></text><text x="32" y="231" xml:space="preserve"><tspan fill="#d4d4d8">  3. No</tspan></text><text x="32" y="271" xml:space="preserve"><tspan fill="#7c7c88">allowlist-coach: ●●●●○ 4/5 approvals · 1 more and /allowlist offers Bash(./mvnw test:*)</tspan></text><text x="20" y="312" fill="#8a8aa0" font-size="11" letter-spacing="1">TOAST AFTER 5 APPROVALS</text><rect x="20" y="326" width="775" height="40" rx="10" fill="#202a33" stroke="#3a3a48"/><text x="32" y="351" xml:space="preserve"><tspan fill="#d4d4d8">You approved Bash(./mvnw test:*) 5 times here. /allowlist to add it to permissions.allow.</tspan></text><text x="20" y="392" fill="#8a8aa0" font-size="11" letter-spacing="1">/ALLOWLIST</text><rect x="20" y="406" width="796" height="320" rx="6" fill="none" stroke="#3a3a48"/><rect x="30" y="398" width="87.60000000000001" height="16" fill="#16161e"/><text x="36" y="410" fill="#d4d4d8" font-weight="700">Allowlist</text><text x="32" y="431" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">Permission dialogs answered in /repo. A rule is offered after 5 approvals and no refusal.</tspan></text><text x="32" y="451" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan></text><text x="32" y="471" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#d4d4d8" font-weight="700">Ready to allow</tspan></text><text x="32" y="491" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88"> 1</tspan><tspan fill="#d4d4d8"> </tspan><tspan fill="#98c379">✓ 14</tspan><tspan fill="#d4d4d8"> </tspan><tspan fill="#d4d4d8">Bash(./mvnw test:*)</tspan><tspan fill="#d4d4d8"> </tspan><tspan fill="#56b6c2">[ allow ]</tspan><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">dismiss</tspan></text><text x="32" y="511" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">      e.g. ./mvnw test -Dtest=T13 · 12 min ago</tspan></text><text x="32" y="531" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan></text><text x="32" y="551" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#d4d4d8" font-weight="700">Counted</tspan></text><text x="32" y="571" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88"> 2 counting   </tspan><tspan fill="#d97757">●●●○○ 3/5  </tspan><tspan fill="#d4d4d8">Bash(npm run lint)</tspan></text><text x="32" y="591" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">      e.g. npm run lint · 12 min ago</tspan></text><text x="32" y="611" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88"> 3 refused    </tspan><tspan fill="#d4d4d8">✓  6 </tspan><tspan fill="#e5c07b">✗  1  </tspan><tspan fill="#d4d4d8">Bash(docker compose up -d)</tspan></text><text x="32" y="631" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">      e.g. docker compose up -d · 12 min ago</tspan></text><text x="32" y="651" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88"> 4 risky      </tspan><tspan fill="#d4d4d8">✓  9 </tspan><tspan fill="#d4d4d8">✗  0  </tspan><tspan fill="#d4d4d8">Bash(rm -rf target)</tspan></text><text x="32" y="671" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">      e.g. rm -rf target · 12 min ago</tspan></text><text x="32" y="691" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan></text><text x="32" y="711" xml:space="preserve"><tspan fill="#d4d4d8"> </tspan><tspan fill="#7c7c88">/allowlist </tspan><tspan fill="#7c7c88">allow</tspan><tspan fill="#7c7c88"> · </tspan><tspan fill="#7c7c88">dismiss</tspan><tspan fill="#7c7c88"> · </tspan><tspan fill="#7c7c88">reset</tspan><tspan fill="#7c7c88"> · </tspan><tspan fill="#7c7c88">help</tspan><tspan fill="#d4d4d8">  </tspan><tspan fill="#56b6c2">[ Close ]</tspan></text></svg>
